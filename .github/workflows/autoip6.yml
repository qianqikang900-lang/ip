name: Collect IPs and Save to Files

on:
  schedule:
    - cron: '0 18 * * *'   # 每天 UTC 时间 18:00 执行（即北京时间每天早上 02:00）
  workflow_dispatch:         # 允许手动触发

permissions:
  contents: write
  actions: write

jobs:
  collect-ip-addresses:
    runs-on: ubuntu-latest
    steps:
      - name: Delete previous workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 3

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests ipaddress

      - name: Run IP collection script
        run: python autoip6.py

      - name: Commit and push results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
         commit_message: "chore: update ip and fast_ip results [auto]"
         file_pattern: "ip.txt ipv6.txt fast_ip.txt"  # 或者直接用 "*.txt"
         commit_user_name: GitHub Action
         commit_user_email: action@github.com
         skip_fetch: false
